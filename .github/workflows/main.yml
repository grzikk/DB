name: CI

on:
  workflow_dispatch:

env:
  k1: ${{ secrets.AK1 }}
  k2: ${{ secrets.AK2 }}
  k3: ${{ secrets.DT }}

jobs:
   run-python:
       runs-on: ubuntu-latest
       
       steps:
        - name: Checkout Code
          uses: actions/checkout@v5

        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.13'

        - name: Run Python Script
          run: |
            python -m pip install requests
            python -m pip install discord.py
            .github/workflows/DB.py
